<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | OMEGA Academy</title>
<link rel="icon" href="./img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <img src="./img/logo.png" alt="شعار OMEGA Academy">
    <div class="brand-name">OMEGA <span>Academy</span></div>
  </div>
  <button class="navbar-toggle">☰</button>
  <ul class="nav-links">
    <li><a href="./index.html">الرئيسية</a></li>
    <li><a href="./resources.html">المكتبة</a></li>
    <li><a href="./subjects-newspaper.html">جريدة المواد</a></li>
    <li><a href="./courses.html">الدورات</a></li>
    <li><a href="./programs.html">البرامج</a></li>
    <li><a href="./gpa.html">حساب المعدل</a></li>
    <li><a href="./contact.html">تواصل معنا</a></li>
    <li id="auth-area"></li>
  </ul>
</nav>

<div class="auth-wrap">
  <h2>إنشاء حساب جديد</h2>
  <p class="sub">انضم لمجتمع OMEGA Academy وابدأ رحلتك التعليمية</p>
  <div class="form-msg" id="msg"></div>
  <form id="register-form">
    <div class="field">
      <label>الاسم الكامل</label>
      <input type="text" name="name" required placeholder="اسمك الكامل">
    </div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" name="email" required placeholder="example@mail.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" name="password" required placeholder="6 أحرف على الأقل" minlength="6">
    </div>
    <button type="submit" class="btn btn-orange" style="width:100%; justify-content:center;">إنشاء الحساب</button>
  </form>
  <p class="auth-switch">لديك حساب مسبقاً؟ <a href="/login.html">سجّل دخولك</a></p>
</div>

<script src="./js/app.js"></script>
<script>
document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // جلب قيم الحقول
    const name = document.querySelectorAll('input')[0].value;
    const email = document.querySelectorAll('input')[1].value;
    const password = document.querySelectorAll('input')[2].value;

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();

        if (data.success) {
            // حفظ بيانات المستخدم في المتصفح لعدم الخروج
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            alert('تم إنشاء الحساب بنجاح!');
            window.location.href = '/index.html'; // أو التوجيه للموقع مباشرة
        } else {
            alert(data.message || 'حدث خطأ أثناء التسجيل');
        }
    } catch (err) {
        console.error(err);
        alert('تعذر الاتصال بالسيرفر!');
    }
});
</script>
</body>
</html>
