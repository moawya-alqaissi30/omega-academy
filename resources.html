  <style>
    .resources-section {
      padding: 50px 20px;
      min-height: 80vh;
      text-align: center;
    }
    .search-box {
      margin: 0 auto 30px auto;
      max-width: 500px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #ff9900;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }
    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .folder-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      text-decoration: none;
      color: #fff;
    }
    .folder-card:hover {
      transform: translateY(-5px);
      border-color: #ff9900;
      background: rgba(255, 153, 0, 0.08);
    }
    .folder-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .folder-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #e0e0e0;
      direction: ltr; /* لضمان ظهور أسماء المواد الإنجليزية بشكل صحيح */
    }
    .btn-open {
      background: #ff9900;
      color: #000;
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }
  </style>

    ];

    function displayFolders(data) {
      const container = document.getElementById('foldersContainer');
      container.innerHTML = '';
      data.forEach(f => {
        const card = document.createElement('a');
        card.className = 'folder-card';
        card.href = f.link;
        card.target = '_blank';
        card.innerHTML = `
          <div class="folder-icon">📁</div>
          <div class="folder-title">${f.name}</div>
          <span class="btn-open">فتح المجلد</span>
        `;
        container.appendChild(card);
      });
    }

    function filterFolders() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = folders.filter(f => f.name.toLowerCase().includes(query));
      displayFolders(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      displayFolders(folders);
    });
  </script>
