<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | OMEGA Academy</title>
<link rel="icon" href="./img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <img src="./img/logo.png" alt="شعار OMEGA Academy">
    <div class="brand-name">OMEGA <span>Academy</span></div>
  </div>
  <button class="navbar-toggle">☰</button>
  <ul class="nav-links">
    <li><a href="./index.html">الرئيسية</a></li>
    <li><a href="./dashboard.html">حسابي</a></li>
    <li id="auth-area"></li>
  </ul>
</nav>

<section class="section">
  <h2 class="section-title">لوحة تحكم الأدمن</h2>
  <p class="section-subtitle">إدارة المصادر التعليمية، البرامج، والمستخدمين</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="resources">المكتبة</button>
    <li><a href="./subjects-newspaper.html">جريدة المواد</a></li>
    <button class="tab-btn" data-tab="programs">البرامج</button>
    <button class="tab-btn" data-tab="courses">الدورات</button>
    <button class="tab-btn" data-tab="users">المستخدمون</button>
  </div>

  <!-- تبويب المصادر -->
  <div class="tab-panel active" id="tab-resources">
    <div class="table-wrap" style="margin-bottom:24px;">
      <h3 style="margin-bottom:16px;">إضافة مصدر جديد</h3>
      <form id="resource-form">
        <div class="course-row" style="grid-template-columns: 1.5fr 1fr 1fr 1.5fr 1fr auto;">
          <input type="text" placeholder="العنوان" name="title" required>
          <input type="text" placeholder="التخصص" name="subject" required>
          <input type="text" placeholder="النوع (فيديو/PDF)" name="type">
          <input type="text" placeholder="الرابط" name="url">
          <input type="text" placeholder="وصف مختصر" name="description">
          <button type="submit" class="btn btn-orange btn-small">إضافة</button>
        </div>
      </form>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>العنوان</th><th>التخصص</th><th>النوع</th><th></th></tr></thead>
        <tbody id="resources-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- تبويب البرامج -->
  <div class="tab-panel" id="tab-programs">
    <div class="table-wrap" style="margin-bottom:24px;">
      <h3 style="margin-bottom:16px;">إضافة برنامج جديد</h3>
      <form id="program-form">
        <div class="course-row" style="grid-template-columns: 1.5fr 2fr 1fr auto;">
          <input type="text" placeholder="عنوان البرنامج" name="title" required>
          <input type="text" placeholder="الوصف" name="description">
          <input type="text" placeholder="المدة (مثال: 4 أسابيع)" name="duration">
          <button type="submit" class="btn btn-orange btn-small">إضافة</button>
        </div>
      </form>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>العنوان</th><th>المدة</th><th></th></tr></thead>
        <tbody id="programs-tbody"></tbody>
      </table>
    </div>
  </div>


  <!-- تبويب الدورات -->
  <div class="tab-panel" id="tab-courses">
    <div class="table-wrap" style="margin-bottom:24px;">
      <h3 style="margin-bottom:16px;">إضافة دورة جديدة</h3>
      <form id="course-form">
        <div class="course-row" style="grid-template-columns: 1.5fr 2fr 1fr 1fr auto;">
          <input type="text" placeholder="عنوان الدورة" name="title" required>
          <input type="text" placeholder="الوصف" name="description">
          <input type="text" placeholder="المدة" name="duration">
          <input type="text" placeholder="التصنيف" name="category">
          <button type="submit" class="btn btn-orange btn-small">إضافة</button>
        </div>
      </form>
    </div>
    <div class="table-wrap"><table><thead><tr><th>العنوان</th><th>التصنيف</th><th>المدة</th><th></th></tr></thead><tbody id="courses-tbody"></tbody></table></div>
  </div>

  <!-- تبويب المستخدمين -->
  <div class="tab-panel" id="tab-users">
    <div class="table-wrap">
      <table>
        <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الصلاحية</th><th></th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="./js/app.js"></script>
<script>
let currentUser = null;

// ---------- التبويبات ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// ---------- المصادر ----------
async function loadResources() {
  const data = await api('/api/resources');
  const tbody = document.getElementById('resources-tbody');
  if (!data.resources.length) {
    tbody.innerHTML = '<tr><td colspan="4">لا يوجد مصادر بعد</td></tr>';
    return;
  }
  tbody.innerHTML = data.resources.map(r => `
    <tr>
      <td>${escapeHtml(r.title)}</td>
      <td>${escapeHtml(r.subject)}</td>
      <td>${escapeHtml(r.type || '-')}</td>
      <td><button class="btn btn-danger btn-small" data-id="${r.id}" data-type="resource">حذف</button></td>
    </tr>
  `).join('');
}

document.getElementById('resource-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  await api('/api/resources', {
    method: 'POST',
    body: JSON.stringify({
      title: form.get('title'),
      subject: form.get('subject'),
      type: form.get('type'),
      url: form.get('url'),
      description: form.get('description')
    })
  });
  e.target.reset();
  loadResources();
});

// ---------- البرامج ----------
async function loadPrograms() {
  const data = await api('/api/programs');
  const tbody = document.getElementById('programs-tbody');
  if (!data.programs.length) {
    tbody.innerHTML = '<tr><td colspan="3">لا يوجد برامج بعد</td></tr>';
    return;
  }
  tbody.innerHTML = data.programs.map(p => `
    <tr>
      <td>${escapeHtml(p.title)}</td>
      <td>${escapeHtml(p.duration || '-')}</td>
      <td><button class="btn btn-danger btn-small" data-id="${p.id}" data-type="program">حذف</button></td>
    </tr>
  `).join('');
}

document.getElementById('program-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  await api('/api/programs', {
    method: 'POST',
    body: JSON.stringify({
      title: form.get('title'),
      description: form.get('description'),
      duration: form.get('duration')
    })
  });
  e.target.reset();
  loadPrograms();
});

// ---------- الدورات ----------
async function loadCourses() {
  const data = await api('/api/courses');
  const tbody = document.getElementById('courses-tbody');
  if (!data.courses.length) { tbody.innerHTML = '<tr><td colspan="4">لا يوجد دورات بعد</td></tr>'; return; }
  tbody.innerHTML = data.courses.map(c => `<tr><td>${escapeHtml(c.title)}</td><td>${escapeHtml(c.category || '-')}</td><td>${escapeHtml(c.duration || '-')}</td><td><button class="btn btn-danger btn-small" data-id="${c.id}" data-type="course">حذف</button></td></tr>`).join('');
}

document.getElementById('course-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  await api('/api/courses', { method: 'POST', body: JSON.stringify({ title: form.get('title'), description: form.get('description'), duration: form.get('duration'), category: form.get('category') }) });
  e.target.reset(); loadCourses();
});

// ---------- المستخدمون ----------
async function loadUsers() {
  const data = await api('/api/admin/users');
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = data.users.map(u => `
    <tr>
      <td>${escapeHtml(u.name)}</td>
      <td>${escapeHtml(u.email)}</td>
      <td>${u.role === 'admin' ? 'أدمن' : 'طالب'}</td>
      <td style="display:flex; gap:8px;">
        ${u.id !== currentUser.id ? `
          <button class="btn btn-outline btn-small" data-id="${u.id}" data-type="role" data-role="${u.role === 'admin' ? 'student' : 'admin'}">
            ${u.role === 'admin' ? 'إزالة صلاحية أدمن' : 'ترقية لأدمن'}
          </button>
          <button class="btn btn-danger btn-small" data-id="${u.id}" data-type="user">حذف</button>
        ` : '<span style="color:var(--gray-text);">(حسابك)</span>'}
      </td>
    </tr>
  `).join('');
}

// ---------- تفويض النقر على أزرار الحذف/التعديل ----------
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  const { id, type, role } = btn.dataset;

  if (type === 'resource' && confirm('هل تريد حذف هذا المصدر؟')) {
    await api(`/api/resources/${id}`, { method: 'DELETE' });
    loadResources();
  }
  if (type === 'program' && confirm('هل تريد حذف هذا البرنامج؟')) {
    await api(`/api/programs/${id}`, { method: 'DELETE' });
    loadPrograms();
  }
  if (type === 'course' && confirm('هل تريد حذف هذه الدورة؟')) {
    await api(`/api/courses/${id}`, { method: 'DELETE' });
    loadCourses();
  }
  if (type === 'user' && confirm('هل تريد حذف هذا المستخدم؟')) {
    await api(`/api/admin/users/${id}`, { method: 'DELETE' });
    loadUsers();
  }
  if (type === 'role') {
    await api(`/api/admin/users/${id}/role`, { method: 'PUT', body: JSON.stringify({ role }) });
    loadUsers();
  }
});

(async () => {
  currentUser = await requireAuth({ adminOnly: true });
  if (!currentUser) return;
  loadResources();
  loadPrograms();
  loadCourses();
  loadUsers();
})();
</script>
</body>
</html>
